<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cat's Snake Engine by ChatGPT</title>
<style>
  body { margin:0; font-family:sans-serif; background:#222; color:white;
         display:flex; flex-direction:column; align-items:center; justify-content:center;
         height:100vh;}
  #menu { text-align:center; }
  #menu h1 { margin-bottom:20px; font-size:2em;}
  .button { display:inline-block; padding:10px 20px; margin:5px;
            background:#444; color:white; border:none; cursor:pointer; font-size:1em;}
  .button:hover { background:#666;}
  #gameContainer { display:none; text-align:center; }
  canvas { border:2px solid #fff;}
  #info { margin-top:10px; font-size:1.2em;}
</style>
</head>
<body>

<div id="menu">
  <h1>Cat's Snake Engine by ChatGPT</h1>
  <button class="button" id="playBtn">Play Game</button>
  <button class="button" id="exitBtn">Exit</button>
  <button class="button" id="helpBtn">Help</button>
  <button class="button" id="soundBtn">Sound: Off</button>
  <button class="button" id="aboutBtn">About</button>
  <button class="button" id="copyrightBtn">Copyright</button>
</div>

<div id="gameContainer">
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="info">Score: <span id="score">0</span></div>
</div>

<script>
"use strict";

/* -------------------- Prompt Files: OFF --------------------------- */
// All code is self‑contained; no external prompt files are loaded.

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gridSize = 20;
const cellSize = canvas.width / gridSize;
let direction = {x:1, y:0};
const speed = 150; // ms
let snake;
let food;
let score;
let gameOver;
let gameStarted = false;
let soundEnabled = false;   // default off

/* -------------------- Audio Setup (simple beep) ------------------- */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBeep() {
  if (!soundEnabled) return;
  const osc = audioCtx.createOscillator();
  osc.frequency.value = 440; // A4
  osc.type = 'square';
  osc.connect(audioCtx.destination);
  osc.start();
  setTimeout(() => { osc.stop(); }, 100); // 100ms beep
}

/* -------------------- Game Initialization ------------------------ */
function initGame() {
  snake = [{x:5, y:10}, {x:4, y:10}, {x:3, y:10}];
  direction = {x:1, y:0};
  food = spawnFood();
  score = 0;
  document.getElementById('score').textContent = score;
  gameOver = false;
}

/* -------------------- Food Spawning ------------------------------ */
function spawnFood() {
  let newFood;
  while (true) {
    newFood = {x: Math.floor(Math.random()*gridSize), y: Math.floor(Math.random()*gridSize)};
    if (!snake.some(seg => seg.x === newFood.x && seg.y === newFood.y)) break;
  }
  return newFood;
}

/* -------------------- Game Loop ----------------------------------- */
function gameLoop() {
  if (!gameStarted) return;
  moveSnake();
  checkCollision();
  draw();
}

/* -------------------- Move Snake --------------------------------- */
function moveSnake() {
  const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById('score').textContent = score;
    food = spawnFood();
    playBeep();  // beep when eating
  } else {
    snake.pop();
  }
}

/* -------------------- Collision Check ---------------------------- */
function checkCollision() {
  const head = snake[0];
  // Wall collision
  if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
    endGame();
    return;
  }
  // Self collision
  for (let i = 1; i < snake.length; i++) {
    if (head.x === snake[i].x && head.y === snake[i].y) {
      endGame();
      return;
    }
  }
}

/* -------------------- Drawing ------------------------------------- */
function draw() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Food
  ctx.fillStyle = '#ff0';
  ctx.fillRect(food.x*cellSize, food.y*cellSize, cellSize, cellSize);
  // Snake
  ctx.fillStyle = '#0f0';
  snake.forEach(seg => {
    ctx.fillRect(seg.x*cellSize, seg.y*cellSize, cellSize, cellSize);
  });
}

/* -------------------- End Game ----------------------------------- */
function endGame() {
  gameOver = true;
  // Overlay Game Over text
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff';
  ctx.font = '30px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('Game Over', canvas.width/2, canvas.height/2);
}

/* -------------------- Menu Event Handlers ------------------------ */
document.getElementById('playBtn').addEventListener('click', () => {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('gameContainer').style.display = 'block';
  initGame();
  gameStarted = true;
});

document.getElementById('exitBtn').addEventListener('click', () => {
  try { window.close(); } catch(e) {}
  location.reload();
});

document.getElementById('helpBtn').addEventListener('click', () => {
  alert('Use arrow keys to move the snake.\nEat yellow squares to grow.\nAvoid walls and yourself.');
});

document.getElementById('soundBtn').addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  document.getElementById('soundBtn').textContent = 'Sound: ' + (soundEnabled ? 'On' : 'Off');
});

document.getElementById('aboutBtn').addEventListener('click', () => {
  alert(`Cat's Snake Engine by ChatGPT
Version 1.0
© 2024 Cat's Studio`);
});

document.getElementById('copyrightBtn').addEventListener('click', () => {
  alert('© 2024 Cat\'s Studio. All rights reserved.');
});

/* -------------------- Keyboard Input ----------------------------- */
document.addEventListener('keydown', e => {
  if (!gameStarted) return;
  switch(e.key) {
    case 'ArrowUp':
      if (direction.y !== 1) direction = {x:0, y:-1};
      break;
    case 'ArrowDown':
      if (direction.y !== -1) direction = {x:0, y:1};
      break;
    case 'ArrowLeft':
      if (direction.x !== 1) direction = {x:-1, y:0};
      break;
    case 'ArrowRight':
      if (direction.x !== -1) direction = {x:1, y:0};
      break;
  }
});

/* -------------------- Start Interval Loop ------------------------ */
setInterval(gameLoop, speed);
</script>
</body>
</html>
